    - uuid: 4f856733494c40409326688cc1eb4a96
      name: Templates/Temperature
  templates:
    - uuid: 961fa4652fd3473387db1553b5e430e6
      template: 'Temp Monitor ESP32'
      name: 'Temp Monitor ESP32'
      description: |
        Template for ESP32 DS18B20 Temperature Monitor (SNMP).
        4 OneWire buses × up to 5 sensors.
        Value = temperature × 10 (281 → 28.1 °C).
        -1270 = sensor missing / disconnected / fault.
      groups:
        - name: Templates/Temperature
      items:
        - uuid: 6c1ee1cebf2b48818cad1b46d2c33f1e
          name: 'Bus 1 Sensor 1'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.99999.1.1.0'
          key: temp.bus1.sensor1
          delay: 30s
          history: 90d
          trends: 365d
          value_type: FLOAT
          units: '°C'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
            - type: JAVASCRIPT
              parameters:
                - |
                  if (value == -127 || value == -127.0) return null;
                  return parseFloat(value).toFixed(1);
          tags:
            - tag: bus
              value: '1'
            - tag: sensor
              value: '1'

